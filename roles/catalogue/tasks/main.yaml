 
  - name: app setup 
    include_role:
      name: common 
      tasks_from: app-setup 
  
  - name: nodejs setup 
    include_role:
      name: common 
      tasks_from: nodejs

  - name: systemd setup 
    include_role:
      name: common
      tasks_from: systemd-setup

  - name: setup mongodb repo 
    ansible.builtin.copy:
      src: mongo.repo 
      dest: /etc/yum.repos.d/mongo.repo 
  
  - name: install mongodb client 
    ansible.builtin.dnf:
      name: mongodb-mongosh 
      state: present 

