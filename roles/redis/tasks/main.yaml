
  - name: disabled latest version and enabled old version of redis 
    ansible.builtin.command: "dnf module disable {{ component }} -y"
    ansible.builtin.command: "dnf module enable {{ component }}:7 -y"
    
  - name: install redis 
    ansible.builtin.dnf:
      name: "{{ component }}"
      state: installed 

  - name: setup remote login using ip 
    ansible.builtin.replace:
      path: /etc/redis/redis.conf 
      regexp: 127.0.0.1
      replace: 0.0.0.0 

  - name: setup remote login using protection mode 
    ansible.builtin.replace:
      path: /etc/redis/redis.conf 
      regexp: protected-mode yes
      replace: protected-mode no 

  - name: enable and start the redis
    ansible.builtin.service:
      name: "{{ component }}"
      state: started 
      enabled: yes 
       
      
  
